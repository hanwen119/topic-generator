<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:linear-gradient(135deg,#FFF6EC 0%,#FFE3D2 60%,#FFD9C2 100%);
font-family:-apple-system,"PingFang TC",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.deco{position:absolute;border-radius:50%;opacity:.5}
.d1{width:300px;height:300px;background:#FFF3C9;top:-90px;right:-60px}
.d2{width:220px;height:220px;background:#FFE4E1;bottom:-70px;left:-50px}
.box{text-align:center;position:relative}
.emoji{font-size:110px;margin-bottom:10px}
h1{font-size:88px;color:#4A3B2E;letter-spacing:6px;margin-bottom:22px}
p{font-size:38px;color:#84685A;letter-spacing:3px}
.brand{margin-top:38px;display:inline-block;background:#D95F3B;color:#fff;font-size:30px;border-radius:999px;padding:14px 44px;letter-spacing:2px}
.grid{position:absolute;display:grid;grid-template-columns:repeat(3,44px);gap:8px;opacity:.6}
.g1{left:70px;top:140px}
.g2{right:80px;bottom:130px}
.grid span{width:44px;height:44px;background:#fff;border-radius:12px;box-shadow:0 3px 8px rgba(160,110,80,.18)}
</style></head>
<body>
<div class="deco d1"></div><div class="deco d2"></div>
<div class="grid g1"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="grid g2"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="box">
  <div class="emoji">🎯</div>
  <h1>短影音選題神器</h1>
  <p>九宮格交叉 × 秒選口播題目 × 一鍵拿提示詞</p>
  <div class="brand">幸福媽媽設計師 🌸</div>
</div>
</body>
</html>
